<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pedestal bajito de piedra -->
  <rect x="14" y="46" width="36" height="8" rx="1" fill="#3c3c44" stroke="#1c1c22" stroke-width="1.5"/>
  <rect x="18" y="40" width="28" height="8" rx="1" fill="#55555f" stroke="#242429" stroke-width="1.5"/>
  <rect x="18" y="40" width="28" height="3" fill="#6c6c78" opacity="0.6"/>

  <!-- Pizza -->
  <g transform="translate(32,30)">
    <circle r="15" fill="#e0a84a" stroke="#a5691f" stroke-width="2"/>
    <circle r="12" fill="#e8b93f"/>
    <circle r="12" fill="none" stroke="#c68a1e" stroke-width="1.2" stroke-dasharray="2 3"/>
    <!-- pepperoni -->
    <circle cx="-5" cy="-4" r="2.6" fill="#a02f1f"/>
    <circle cx="4" cy="-6" r="2.6" fill="#a02f1f"/>
    <circle cx="6" cy="3" r="2.6" fill="#a02f1f"/>
    <circle cx="-6" cy="5" r="2.6" fill="#a02f1f"/>
    <circle cx="0" cy="1" r="2.6" fill="#a02f1f"/>
    <!-- lineas de porciones -->
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#c68a1e" stroke-width="1"/>
    <line x1="0" y1="0" x2="13" y2="7.5" stroke="#c68a1e" stroke-width="1"/>
    <line x1="0" y1="0" x2="-13" y2="7.5" stroke="#c68a1e" stroke-width="1"/>
  </g>
</svg>
