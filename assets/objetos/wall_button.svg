<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Placa metálica -->
  <rect x="6" y="4" width="52" height="56" rx="3" fill="#3a3a42" stroke="#1c1c22" stroke-width="2"/>
  <rect x="10" y="8" width="44" height="48" rx="2" fill="#232328"/>
  <!-- Remaches -->
  <circle cx="12" cy="10" r="1.6" fill="#54545c"/>
  <circle cx="52" cy="10" r="1.6" fill="#54545c"/>
  <circle cx="12" cy="54" r="1.6" fill="#54545c"/>
  <circle cx="52" cy="54" r="1.6" fill="#54545c"/>
  <!-- Marco del botón -->
  <rect x="18" y="16" width="28" height="34" rx="2" fill="#141416" stroke="#0a0a0b" stroke-width="1.5"/>
  <!-- Botón (pastilla roja) -->
  <rect x="22" y="20" width="20" height="14" rx="2" fill="#8a1f1f" stroke="#4a0f0f" stroke-width="1"/>
  <rect x="22" y="20" width="20" height="6" rx="2" fill="#c23a2f" opacity="0.85"/>
  <!-- Luz indicadora -->
  <circle cx="32" cy="42" r="4.2" fill="#2fbf3a">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="42" r="4.2" fill="none" stroke="#0a2e0d" stroke-width="1"/>
</svg>
